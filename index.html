<title>Copa Mesa de los Fieles</title>

<style>
html{-webkit-text-size-adjust:100%}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: sticky marcador (título + pestañas) sobre una columna única de tarjetas; scoreboard condensado, números tabulares. */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface2:#E4EBE7; --ink:#11201C; --muted:#586A64; --line:#D2DBD6;
  --accent:#0E6A58; --accent-ink:#FFFFFF; --gold:#8F6410; --gold-bg:#F3E7BF; --bad:#A8352D;
  --p0-bg:#F0D9D6; --p0-fg:#8A2E27; --p1-bg:#E4EBE7; --p1-fg:#3F524C; --p2-bg:#D3E8DC; --p2-fg:#17503A;
  --p3-bg:#B5DEC6; --p3-fg:#0F4730; --p4-bg:#EBD58F; --p4-fg:#5E4208;
  --f-d:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --f-b:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1815; --surface:#13241F; --surface2:#1B312B; --ink:#E7F0EC; --muted:#93AAA2; --line:#27403A;
  --accent:#4FC3A6; --accent-ink:#06251D; --gold:#E3B547; --gold-bg:#3A3015; --bad:#F08A80;
  --p0-bg:#4A2220; --p0-fg:#F4B8B2; --p1-bg:#1F352F; --p1-fg:#A9C0B8; --p2-bg:#1D4A38; --p2-fg:#BDE9D2;
  --p3-bg:#23664B; --p3-fg:#DDF5E8; --p4-bg:#6B5416; --p4-fg:#FBE9A8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1815; --surface:#13241F; --surface2:#1B312B; --ink:#E7F0EC; --muted:#93AAA2; --line:#27403A;
  --accent:#4FC3A6; --accent-ink:#06251D; --gold:#E3B547; --gold-bg:#3A3015; --bad:#F08A80;
  --p0-bg:#4A2220; --p0-fg:#F4B8B2; --p1-bg:#1F352F; --p1-fg:#A9C0B8; --p2-bg:#1D4A38; --p2-fg:#BDE9D2;
  --p3-bg:#23664B; --p3-fg:#DDF5E8; --p4-bg:#6B5416; --p4-fg:#FBE9A8; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-b)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:0;padding-bottom:48px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-top:14px}
[hidden]{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}
h1{font:700 30px/1 var(--f-d);letter-spacing:.01em;text-transform:uppercase;margin:0;text-wrap:balance}
.sub{font-size:13px;color:var(--muted)}
.pill{flex:none;font:600 12px/1 var(--f-b);padding:6px 10px;border-radius:99px;background:var(--surface2);color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:block}
.pill.live{color:var(--accent)} .pill.live i{background:var(--accent)}
.pill.err{color:var(--bad)} .pill.err i{background:var(--bad)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);margin-top:12px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px 9px;font:600 14px var(--f-b);color:var(--muted);margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{display:flex;flex-direction:column;gap:14px;padding-top:14px}
main>section{display:flex;flex-direction:column;gap:14px;min-width:0}
.banner{background:var(--gold-bg);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:13px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.card h2{font:700 20px/1.1 var(--f-d);text-transform:uppercase;letter-spacing:.02em;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h2 small{font:500 12px var(--f-b);text-transform:none;letter-spacing:0;color:var(--muted)}
.tag{font:600 11px/1 var(--f-b);text-transform:uppercase;letter-spacing:.06em;padding:4px 7px;border-radius:5px;background:var(--surface2);color:var(--muted)}
.tag.gold{background:var(--gold-bg);color:var(--gold)}

.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.pos{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--f-d);background:var(--surface2);color:var(--muted)}
.row.lead .pos{background:var(--gold-bg);color:var(--gold)}
.who b{font-weight:600}
.who span{display:block;font-size:12px;color:var(--muted)}
.mini{display:flex;gap:6px;font-size:12px;color:var(--muted)}
.mini span{background:var(--surface2);border-radius:5px;padding:3px 6px;white-space:nowrap}
.big{font:700 30px/1 var(--f-d);text-align:right}
.win{font-size:12px;color:var(--gold);font-weight:600}
.note{font-size:13px;color:var(--muted);margin-top:8px}

.pt{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:6px;font:700 15px var(--f-d);padding:0 5px}
.p0{background:var(--p0-bg);color:var(--p0-fg)} .p1{background:var(--p1-bg);color:var(--p1-fg)} .p2{background:var(--p2-bg);color:var(--p2-fg)}
.p3{background:var(--p3-bg);color:var(--p3-fg)} .p4{background:var(--p4-bg);color:var(--p4-fg)}

.prizes .row{grid-template-columns:minmax(0,1fr) auto}
.prizes .amt{font:700 18px var(--f-d);text-align:right}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 6px;text-align:left;min-width:0}
.seg button b{display:block;font:700 17px/1.1 var(--f-d);text-transform:uppercase}
.seg button span{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.meta{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin}
.chips button{flex:none;width:36px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:700 16px var(--f-d);position:relative}
.chips button.part::after,.chips button.done::after{content:"";position:absolute;left:50%;bottom:4px;width:14px;height:3px;border-radius:2px;transform:translateX(-50%);background:var(--muted)}
.chips button.done::after{background:var(--accent)}
.chips button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips button[aria-current="true"]::after{background:var(--accent-ink)}
.hole{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;margin-bottom:6px}
.hole .mid{text-align:center}
.hole .mid b{font:700 32px/1 var(--f-d);text-transform:uppercase}
.hole .mid span{display:block;font-size:13px;color:var(--muted)}
.nav{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font:700 20px var(--f-d)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto 56px;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .who b{font-size:16px}
.step{display:flex;align-items:center;gap:4px}
.sb{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font:700 26px/1 var(--f-d)}
.sb.inc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sb:disabled{opacity:.4;cursor:not-allowed}
.val{font:700 36px/1 var(--f-d);min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
.val.empty{color:var(--muted)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.xb{border:1px solid var(--line);background:var(--surface);border-radius:6px;font:600 12px var(--f-b);padding:3px 8px;color:var(--muted)}
.xb[aria-pressed="true"]{background:var(--p0-bg);color:var(--p0-fg);border-color:var(--p0-fg)}
.scroll{overflow-x:auto}
.conc{padding:8px 0;border-top:1px solid var(--line)}.conc:first-of-type{border-top:0}.conc>b{display:block;font-size:13px;margin-bottom:6px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 60px 124px;gap:8px;align-items:center;margin-bottom:6px}
.crow input{padding:9px 6px;text-align:center}
select{width:100%;padding:10px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px}
.spon{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{height:60px;width:60px;object-fit:cover;border-radius:12px;flex:none}
textarea{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:13px/1.3 ui-monospace,Menlo,monospace;resize:vertical}
.tbl{border-collapse:collapse;min-width:680px;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
.tbl th,.tbl td{text-align:center;padding:4px 0;border-bottom:1px solid var(--line);min-width:28px}
.tbl th.lbl{text-align:left;padding-right:8px;position:sticky;left:0;background:var(--surface);font-weight:600;min-width:52px}
.tbl thead th{font:700 14px var(--f-d)}
.tbl button{background:none;border:0;font:inherit;padding:2px 4px;color:inherit}
.tbl th.cur{color:var(--accent)}
.tbl td.c{font-weight:600;cursor:pointer}
.tbl td.tot{font-weight:700;padding-left:8px}
.tbl tr.dim td,.tbl tr.dim th{color:var(--muted);font-size:12px}
.tbl th.sub,.tbl td.sub{background:var(--surface2);font-weight:700;padding:4px 6px}
.tbl td.lab{text-align:left;color:var(--muted);font-size:12px;padding-right:8px}
.tbl.sum th.lbl{vertical-align:middle;border-right:1px solid var(--line)}
.crow2{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;align-items:center;margin-bottom:6px}
.trow{display:grid;grid-template-columns:1.3fr 1fr 1fr .8fr;gap:6px;margin:-2px 0 8px}
.trow input{padding:8px 4px;text-align:center}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:0 0 8px}
.chk input{width:20px;height:20px}
.who i{font-style:normal}

label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input[type=text],input[type=number],input[inputmode]{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
.fields{display:flex;flex-direction:column;gap:12px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:11px 16px;font-weight:600}
.btn.sec{background:var(--surface2);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.ok{color:var(--accent);font-size:13px} .er{color:var(--bad);font-size:13px} .wn{color:var(--gold);font-size:13px}
details.card summary{cursor:pointer;font:700 20px/1.1 var(--f-d);text-transform:uppercase;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.card summary::-webkit-details-marker{display:none}
details.card[open] summary{margin-bottom:12px}
.ovg{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:8px;align-items:center}
.ovg .h{font-size:12px;color:var(--muted);text-align:center}
.ovg input{padding:8px 6px;text-align:center}
ul.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:9px;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
@media (max-width:380px){.big{font-size:26px}.mini{display:none}}
</style>

function makeRemote(db){return{remote:true,
  sub:function(c,cb,er){return db.collection(c).onSnapshot(function(s){cb(s.docs.map(function(d){return[d.id,d.data()];}),s.metadata);},er);},
  set:function(c,id,d){return db.doc(c+"/"+id).set(d);},
  update:function(c,id,d){return db.doc(c+"/"+id).update(d);}};}
function makeLocal(){var L={},mem={};
  function load(c){try{var v=localStorage.getItem("copa:"+c);if(v)return JSON.parse(v);}catch(e){}return mem[c]||{};}
  function save(c,o){mem[c]=o;try{localStorage.setItem("copa:"+c,JSON.stringify(o));}catch(e){}}
  function emit(c){(L[c]||[]).forEach(function(f){f(Object.entries(load(c)),{fromCache:false});});}
  return{remote:false,
    sub:function(c,cb){(L[c]=L[c]||[]).push(cb);setTimeout(function(){cb(Object.entries(load(c)),{fromCache:false});},0);return function(){};},
    set:function(c,id,d){var o=load(c);o[id]=JSON.parse(JSON.stringify(d));save(c,o);emit(c);return Promise.resolve();},
    update:function(c,id,d){var o=load(c);o[id]=merge(o[id]||{},d);save(c,o);emit(c);return Promise.resolve();}};}

    return p.then(function(){wseq++;busy=false;return poll();},function(e){wseq++;throw e;});}
  document.addEventListener("visibilitychange",function(){if(!document.hidden)poll();});
  api.sub=function(c,cb){subs[c].push(cb);if(!timer){timer=setInterval(poll,POLL_MS);poll();}return function(){};};

/* ---------- cálculo ---------- */
var PRESETS={ce:[["Azules",74.0,129,72],["Blancas",71.0,121,72],["Amarillas",67.1,111,72]],pl:[["Azules",73.0,128,72],["Blancas",71.5,128,72]],vg:[["Azules",71.4,130,72],["Blancas",70.1,127,72],["Rojas",66.1,119,72]]};
function teeFor(p,d){var t=(S.server.tees&&S.server.tees.all||{})[d.id+"_"+p.id];
  if(t&&typeof t.cr==="number"&&typeof t.slope==="number"&&typeof t.par==="number")return{n:t.n||"Otra",cr:t.cr,slope:t.slope,par:t.par};
  return{n:"Azules",cr:d.cr,slope:d.slope,par:d.par};}
function baseHc(p,d){var t=teeFor(p,d);return Math.round(ALLOW[p.id]*(p.hi*t.slope/113+t.cr-t.par));}
function cr1(n){return(Math.round(n*10)/10).toFixed(1).replace(".",",");}
function pct(x){return Math.round(x*100)+"%";}
function allowTxt(){return ALLOW.angel===ALLOW.fede&&ALLOW.fede===ALLOW.mauri?pct(ALLOW.angel):pct(ALLOW.angel)+" (Mauri "+pct(ALLOW.mauri)+")";}
function strokesOn(hc,si){if(hc<=0)return 0;return Math.floor(hc/18)+(si<=hc%18?1:0);}
function getCourse(cid){var c=S.server.courses[cid];
  if(c&&Array.isArray(c.par)&&Array.isArray(c.si)&&c.par.length===18&&c.si.length===18)return c;return null;}
function gross(day,pid,hole){var k=day+"_"+pid,p=S.pending[k];
  if(p&&(hole in p))return p[hole];
  var d=S.server.rounds[k];var v=d&&d.h?d.h[hole]:null;return v===undefined?null:v;}
function selfv(day,pid,hole){var k=day+"_"+pid,p=S.pendingS[k];
  if(p&&(hole in p))return p[hole];
  var d=S.server.selfs[k];var v=d&&d.h?d.h[hole]:null;return v===undefined?null:v;}
function diffs(day,pid){var out=[];for(var h=1;h<=18;h++){var o=gross(day,pid,h),v=selfv(day,pid,h);if(o!==null&&v!==null&&o!==v)out.push({h:h,o:o,s:v});}return out;}
function ptsFor(g,course,hole,hc){
  if(g===null||g===undefined)return null;
  if(g===0)return 0;
  if(!course)return null;
  var net=g-strokesOn(hc,course.si[hole-1]);
  return Math.max(0,2+course.par[hole-1]-net);}
function sumLast(arr,n){var s=0;for(var i=18-n;i<18;i++)s+=arr[i]||0;return s;}
function cmp(a,b){if(a.tot!==b.tot)return b.tot-a.tot;
  var ns=[9,6,3,1];for(var i=0;i<ns.length;i++){var x=sumLast(a.pts,ns[i]),y=sumLast(b.pts,ns[i]);if(x!==y)return y-x;}return 0;}
function rankAll(items,prizes){
  var s=items.slice().sort(cmp),out=[],i=0;
  while(i<s.length){var j=i;while(j+1<s.length&&cmp(s[i],s[j+1])===0)j++;
    var pz=0,k;for(k=i;k<=j;k++)pz+=prizes[k]||0;
    for(k=i;k<=j;k++)out.push({id:s[k].id,tot:s[k].tot,pos:i+1,tied:j>i,prize:pz/(j-i+1)});
    i=j+1;}
  return out;}

function contestHole(day,kind){var x=(S.server.extras[day]||{})[kind];
  if(x&&typeof x.hole==="number")return x.hole;
  var d=DEFAULT_HOLES[day]&&DEFAULT_HOLES[day][kind];if(d)return d;
  var c=getCourse(dayById(day).course);if(!c)return null;
  var want=kind==="approach"?3:5;for(var i=0;i<18;i++)if(c.par[i]===want)return i+1;return null;}
function setConcurso(day,kind,winner,hole){
  var ex=JSON.parse(JSON.stringify(S.server.extras));ex[day]=ex[day]||{};ex[day][kind]={winner:winner,hole:hole};S.server.extras=ex;render();
  writeDoc("extras",day+"_"+kind,{winner:winner,hole:hole},"Guardado");}
document.addEventListener("change",function(e){var t=e.target;if(!t||!t.getAttribute||!isAdmin())return;
  var cw=t.getAttribute("data-cw"),ch=t.getAttribute("data-ch"),key=cw||ch;if(!key)return;
  var q=key.split("|"),day=q[0],kind=q[1],cur=(S.server.extras[day]||{})[kind]||{};
  var winner=cw?(t.value||null):(cur.winner||null),hole=ch?(parseInt(t.value,10)||null):contestHole(day,kind);
  if(hole&&(hole<1||hole>18))hole=null;
  t.blur();setConcurso(day,kind,winner,hole);});

function computeModel(){
  var cfg=S.server.config.main||{};
  var ins=typeof cfg.inscripcion==="number"?cfg.inscripcion:DEFAULT_INS, pot=ins*PLAYERS.length, ov=cfg.hcOverrides||{};
  var carry=0,days=[],totals={};
  PLAYERS.forEach(function(p){totals[p.id]={tot:0,n:0,pts:new Array(18).fill(0),byDay:[],prize:0};});
  DAYS.forEach(function(d,di){
    var course=getCourse(d.course),res={};
    PLAYERS.forEach(function(p){
      var base=baseHc(p,d),auto=base+(p.id==="mauri"?carry:0),o=ov[d.id+"_"+p.id];
      var hc=typeof o==="number"?o:auto,holes=[],pts=[],ga=[],stv=[],n=0,tot=0,pk=0;
      for(var h=1;h<=18;h++){var g=gross(d.id,p.id,h);holes.push(g);var pt=null,st=course?strokesOn(hc,course.si[h-1]):0,a=null;
        if(g!==null){n++;pt=ptsFor(g,course,h,hc);if(pt!==null)tot+=pt;
          if(g>0)a=g;else{pk++;if(course)a=course.par[h-1]+2+st;}}
        pts.push(pt);ga.push(a);stv.push(st);}
      var seg=function(a0,b0){var br=0,sx=0,c=0,pp=0,any=false;
        for(var i=a0;i<b0;i++){if(ga[i]!==null){br+=ga[i];sx+=stv[i];c++;}if(holes[i]!==null){any=true;pp+=pts[i]||0;}}
        return{n:c,br:c?br:null,net:(c&&course)?br-sx:null,pts:(any&&course)?pp:null};};
      var sg={out:seg(0,9),inn:seg(9,18),tot:seg(0,18)};
      res[p.id]={p:p,hc:hc,auto:auto,base:base,over:typeof o==="number",tee:teeFor(p,d),holes:holes,pts:pts,n:n,tot:tot,seg:sg,pk:pk,gr:sg.tot.br||0};
    });
    var complete=PLAYERS.every(function(p){return res[p.id].n===18;});
    var started=PLAYERS.some(function(p){return res[p.id].n>0;});
    var order=rankAll(PLAYERS.map(function(p){return{id:p.id,tot:res[p.id].tot,pts:res[p.id].pts};}),(started&&course)?[pot*0.10,0,0]:[0,0,0]);
    var adj=null;
    if(complete&&course&&di<DAYS.length-1){
      var avg=(res.angel.tot+res.fede.tot)/2,diff=res.mauri.tot-avg,m=Math.abs(diff),mag=m>=12?4:(m>=6?2:0);
      adj={diff:diff,avg:avg,change:diff>0?-mag:mag,next:DAYS[di+1]};carry+=adj.change;}
    PLAYERS.forEach(function(p){var r=res[p.id],t=totals[p.id];t.tot+=r.tot;t.n+=r.n;t.byDay.push(r.tot);
      if(di===DAYS.length-1)t.pts=r.pts.map(function(x){return x||0;});});
    order.forEach(function(o){totals[o.id].prize+=o.prize;});
    days.push({d:d,course:course,res:res,complete:complete,started:started,order:order,adj:adj});
  });
  var cnet={angel:0,fede:0,mauri:0},cdec=0,cpend=0;
  DAYS.forEach(function(d){var ex=S.server.extras[d.id]||{};["approach","drive"].forEach(function(k){var w=ex[k]&&ex[k].winner;
    if(w&&playerById(w)){cdec++;PLAYERS.forEach(function(p){cnet[p.id]+=p.id===w?CONC*(PLAYERS.length-1):-CONC;});}else if(!w)cpend++;});});
  var anyStarted=days.some(function(x){return x.started&&x.course;});
  var allDone=days.every(function(x){return x.complete;});
  var gen=rankAll(PLAYERS.map(function(p){return{id:p.id,tot:totals[p.id].tot,pts:totals[p.id].pts};}),anyStarted?[pot*0.5,pot*0.2,0]:[0,0,0]);
  gen.forEach(function(g){totals[g.id].prize+=g.prize;totals[g.id].gen=g;});
  return{days:days,gen:gen,totals:totals,pot:pot,ins:ins,allDone:allDone,anyStarted:anyStarted,conc:{net:cnet,decided:cdec,pend:cpend}};
}

var wq={};
function PEND(kind){return kind==="selfs"?S.pendingS:S.pending;}
function savePending(){try{localStorage.setItem("copa-pending",JSON.stringify(S.pending));localStorage.setItem("copa-pending-self",JSON.stringify(S.pendingS));}catch(e){}}

  var P=PEND(kind),k=day+"_"+pid;P[k]=P[k]||{};P[k][hole]=val;savePending();

function schedule(day,pid,kind){kind=kind||"rounds";var k=kind+"|"+day+"_"+pid,q=wq[k]=wq[k]||{t:null,busy:false,again:false};
  clearTimeout(q.t);q.t=setTimeout(function(){flush(day,pid,kind);},400);}
function flush(day,pid,kind){
  kind=kind||"rounds";var P=PEND(kind),k=day+"_"+pid,q=wq[kind+"|"+k];if(!q)return;
  if(q.busy){q.again=true;return;}
  var edits=P[k];if(!edits||!Object.keys(edits).length)return;
  var sent={};Object.keys(edits).forEach(function(h){sent[h]=edits[h];});
  q.busy=true;setSync("saving");
  var srv=S.server[kind][k],now=Date.now(),ts={};
  Object.keys(sent).forEach(function(h){ts[h]=now;});
  function drop(){Object.keys(sent).forEach(function(h){if(P[k]&&P[k][h]===sent[h])delete P[k][h];});savePending();}
  var job=srv?S.store.update(kind,k,{h:sent,t:ts,updatedAt:now}):S.store.set(kind,k,{day:day,player:pid,h:sent,t:ts,updatedAt:now});
  job.then(function(){
    drop();var cur=S.server[kind][k]||{};S.server[kind][k]=merge(cur,{day:day,player:pid,h:sent,t:ts});
    setSync("ok");render();
  }).catch(function(e){
    if(e&&(e.code==="forbidden"||e.code==="bad_key")){drop();setSync("err");toast(e.code==="forbidden"?"Esa tarjeta oficial la carga su marcador. No se guardó el cambio.":"Tu link personal no es válido. Pedile a Angel que te lo vuelva a mandar.");}
    else if(e&&e.retry===false){drop();setSync("err");toast("El servidor rechazó ese dato.");}
    else{setSync("err");toast("Sin señal. Tus golpes quedan guardados y se envían solos.");setTimeout(function(){schedule(day,pid,kind);},5000);}
    render();
  }).then(function(){q.busy=false;if(q.again){q.again=false;flush(day,pid,kind);}});
}

function parseNums(s){return(s||"").split(/[^0-9]+/).filter(Boolean).map(Number);}
function validateCourse(parS,siS){
  var par=parseNums(parS),si=parseNums(siS),er=[],wn=[],i;
  if(par.length!==18)er.push("Pares: leí "+par.length+" números, tienen que ser 18.");
  else{par.forEach(function(v,k){if(v<3||v>5)er.push("Par fuera de rango en el hoyo "+(k+1)+" ("+v+").");});
    var sp=par.reduce(function(a,b){return a+b;},0);if(sp!==72)wn.push("Los pares suman "+sp+" y la cancha es par 72. Revisá si está bien.");}
  if(si.length!==18)er.push("SI: leí "+si.length+" números, tienen que ser 18.");
  else{var seen={},dup=[],miss=[];si.forEach(function(v){if(v<1||v>18||seen[v])dup.push(v);seen[v]=1;});
    for(i=1;i<=18;i++)if(!seen[i])miss.push(i);
    if(dup.length||miss.length)er.push("SI repetido o fuera de rango: "+(dup.join(", ")||"–")+". Faltan: "+(miss.join(", ")||"–")+".");}
  return{par:par,si:si,er:er,wn:wn,ok:er.length===0};}

      h+='<div class="crow2"><span>'+esc(p.name)+'</span><select data-tsel="'+k+'"'+dis+' aria-label="Salida de '+esc(p.name)+" "+d.label+'">'+
        pre.map(function(o,i){return'<option value="'+i+'"'+(v.sel===String(i)?" selected":"")+">"+o[0]+" "+cr1(o[1])+" / "+o[2]+"</option>";}).join("")+'<option value="c"'+(v.sel==="c"?" selected":"")+">Otra…</option></select></div>";
      if(v.sel==="c")h+='<div class="trow"><input type="text" data-tf="'+k+'|n" value="'+esc(v.n)+'" placeholder="Nombre"'+dis+' aria-label="Nombre de la salida"><input type="number" step="0.1" inputmode="decimal" data-tf="'+k+'|cr" value="'+v.cr+'" placeholder="CR"'+dis+' aria-label="Course rating"><input type="number" inputmode="numeric" data-tf="'+k+'|slope" value="'+v.slope+'" placeholder="Slope"'+dis+' aria-label="Slope"><input type="number" inputmode="numeric" data-tf="'+k+'|par" value="'+v.par+'" placeholder="Par"'+dis+' aria-label="Par"></div><div class="note" style="margin:-4px 0 8px">Nombre · CR · Slope · Par</div>';});
    h+="</div>";});
  h+='<div id="tees-er"></div><div class="btns" style="margin-top:8px"><button class="btn" id="save-tees"'+(isAdmin()?"":" disabled")+">Guardar salidas</button></div></div>";
  return h;}
function wireTees(){
  function DR(){return S.draftTees||(S.draftTees={});}
  document.querySelectorAll("[data-tsel]").forEach(function(sel){sel.onchange=function(){
    var k=sel.getAttribute("data-tsel"),q=k.split("_"),d=dayById(q[0]),pre=PRESETS[d.course]||[],cur=DR()[k]||{};
    if(sel.value==="c")DR()[k]={sel:"c",n:cur.n||"Otra",cr:cur.cr,slope:cur.slope,par:cur.par};
    else{var o=pre[+sel.value];DR()[k]={sel:sel.value,n:o[0],cr:o[1],slope:o[2],par:o[3]};}
    renderAjustes();};});
  document.querySelectorAll("[data-tf]").forEach(function(inp){inp.oninput=function(){
    var q=inp.getAttribute("data-tf").split("|"),v=DR()[q[0]];if(!v)return;v[q[1]]=q[1]==="n"?inp.value:(inp.value===""?"":+inp.value);};});
  var sv=$("save-tees");if(sv)sv.onclick=function(){
    var map={},err="";
    DAYS.forEach(function(d){PLAYERS.forEach(function(p){var k=teeKey(d,p),v=DR()[k];if(!v)return;
      var cr=+v.cr,sl=+v.slope,pa=+v.par;
      if(!(cr>=55&&cr<=80)||!(sl>=55&&sl<=155)||!(pa>=66&&pa<=74)){err="Revisá "+p.name+" "+d.label+": CR entre 55 y 80, slope entre 55 y 155, par entre 66 y 74.";return;}
      if(cr===d.cr&&sl===d.slope&&pa===d.par)return;
      map[k]={n:(v.n||"Otra"),cr:cr,slope:sl,par:pa};});});
    if(err){$("tees-er").innerHTML='<div class="er">'+esc(err)+"</div>";return;}
    writeDoc("tees","all",{map:map},"Salidas guardadas",function(){S.draftTees=null;renderAjustes();});};
}
function renderAjustes(){
  var dis=isAdmin()?"":" disabled",m=computeModel(),cfg=S.server.config.main||{},dr=S.draftAj||{ins:typeof cfg.inscripcion==="number"?cfg.inscripcion:DEFAULT_INS,ov:cfg.hcOverrides||{}};
  var h='<div class="card"><h2>Inscripción</h2><div class="fields"><label class="f">Inscripción por jugador (pesos)<input type="number" inputmode="numeric" id="ins" value="'+dr.ins+'"'+dis+'></label>'+
    '<div class="note" style="margin:0">Pozo: '+money(dr.ins*PLAYERS.length)+' entre los tres. Se reparte 10% a cada ganador diario (30%), 50% al 1° general y 20% al 2°.</div></div></div>';
  h+=linksCard();
  h+=teesCard();
  h+='<div class="card"><h2>Handicap de juego <small>vacío = automático</small></h2><div class="ovg"><span></span>'+PLAYERS.map(function(p){return'<span class="h">'+esc(p.name)+"</span>";}).join("");
  m.days.forEach(function(x){h+='<span class="muted" style="font-size:13px">'+x.d.label+"</span>";
    PLAYERS.forEach(function(p){var k=x.d.id+"_"+p.id,v=dr.ov[k];h+='<input type="number" inputmode="numeric" data-ov="'+k+'"'+dis+' value="'+(typeof v==="number"?v:"")+'" placeholder="'+x.res[p.id].auto+'" aria-label="HC '+esc(p.name)+" "+x.d.label+'">';});});
  h+='</div><div class="note">Automático: '+allowTxt()+' × (Índice × Slope ÷ 113 + CR − Par), redondeado al final. El de Mauri incluye el ajuste de los días anteriores. Usá el manual solo si el club da otro número.</div>'+
    '<div class="btns" style="margin-top:12px"><button class="btn" id="save-aj"'+(isAdmin()?"":" disabled")+'>Guardar ajustes</button></div></div>';
  h+='<div class="card"><h2>Reglas</h2><ul class="rules"><li>Stableford neto: doble bogey neto o peor 0, bogey 1, par 2, birdie 3, eagle 4. Si ya no suma, se levanta la pelota.</li>'+
    "<li>Inscripción de $100.000 por jugador. Índices: Angel 25,0 · Fede 27,9 · Mauri 45,2. Handicap de juego: "+allowTxt()+" del handicap de cancha de la salida (tee) que usó cada uno: si salen de distinta salida, cada uno usa el CR, slope y par de la suya.</li>"+
    "<li>Tarjeta oficial: la lleva el marcador (Angel marca a Fede, Fede a Mauri, Mauri a Angel) y es la única que cuenta para las posiciones. Cada jugador anota además su autocontrol, que no suma y sirve para detectar diferencias. Solo Angel, como administrador, puede corregir una tarjeta oficial.</li>"+
    "<li>Recalibración de Mauri al cerrar cada día: se compara con el promedio de Angel y Fede. Con 6 o más puntos de diferencia ajusta 2 golpes, con 12 o más 4 (máximo por día). Si Mauri hace más, baja; si hace menos, sube. El ajuste se acumula y cada día se puntúa con el handicap de ese día.</li>"+
    "<li>Premios: ganador de cada día, y 1° y 2° general por suma de los 3 días. Desempate: últimos 9, 6, 3 y hoyo 18. Si sigue el empate, se reparte.</li><li>Concursos diarios (best approach y long drive): el ganador cobra $5.000 de cada uno de los otros dos.</li></ul></div>";
  $("v-ajustes").innerHTML=h;
  function grab(){var ov={};document.querySelectorAll("[data-ov]").forEach(function(i){if(i.value!==""&&!isNaN(+i.value))ov[i.getAttribute("data-ov")]=Math.round(+i.value);});
    var ins=+$("ins").value;return{ins:ins>0?ins:DEFAULT_INS,ov:ov};}
  document.querySelectorAll("#v-ajustes input").forEach(function(i){i.oninput=function(){S.draftAj=grab();};});
  $("save-aj").onclick=function(){var g=grab();writeDoc("config","main",{inscripcion:g.ins,hcOverrides:g.ov,updatedAt:Date.now()},"Ajustes guardados",function(){S.draftAj=null;});};
  wireTees();
}

/* ---------- render y eventos ---------- */
function idleIn(el){return!el.contains(document.activeElement);}
function render(){
  if(S.gate)return;
  TABS.forEach(function(t){$("v-"+t).hidden=t!==S.ui.tab;});
  document.querySelectorAll(".tabs button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.tab===S.ui.tab?"true":"false");});
  var t=S.ui.tab;
  if(t==="posiciones"){if(idleIn($("v-posiciones")))renderPos();}
  else if(t==="tarjeta")renderCard();
  else if(t==="canchas"){if(idleIn($("v-canchas")))renderCanchas();}
  else if(t==="ajustes"){if(idleIn($("v-ajustes")))renderAjustes();}
}
function setTab(t){S.ui.tab=t;saveUi();try{history.replaceState(null,"","#"+t);}catch(e){}render();window.scrollTo(0,0);}
document.querySelector(".tabs").addEventListener("click",function(e){var b=e.target.closest("[data-tab]");if(b)setTab(b.dataset.tab);});

$("v-tarjeta").addEventListener("click",function(e){
  var el;
  if((el=e.target.closest("[data-day]"))){S.ui.day=el.dataset.day;saveUi();render();return;}
  if((el=e.target.closest("[data-hole]"))){S.ui.hole=+el.dataset.hole;saveUi();render();return;}
  if((el=e.target.closest("[data-goto]"))){S.ui.hole=+el.dataset.goto;saveUi();render();window.scrollTo({top:0,behavior:"smooth"});return;}
  if((el=e.target.closest("[data-nav]"))){var n=S.ui.hole+ +el.dataset.nav;if(n>18){setTab("posiciones");return;}if(n<1)return;S.ui.hole=n;saveUi();render();return;}
  if((el=e.target.closest("[data-adminedit]"))){S.adminEdit=!!el.checked;render();return;}
  if((el=e.target.closest("[data-act]"))){
    var row=el.closest(".prow");if(!row||S.readOnly)return;
    var self=row.dataset.s==="1",pid=row.dataset.p;
    if(self?!(S.me&&S.me.player===pid):!canMark(pid))return;
    var day=S.ui.day,hole=S.ui.hole,g=self?selfv(day,pid,hole):gross(day,pid,hole),course=getCourse(dayById(day).course),par=course?course.par[hole-1]:4,a=el.dataset.act,kind=self?"selfs":"rounds";
    if(a==="pick")setHole(day,pid,hole,g===0?null:0,kind);
    else if(a==="inc")setHole(day,pid,hole,(g===null||g===0)?par:Math.min(15,g+1),kind);
    else if(a==="dec")setHole(day,pid,hole,(g===null||g===0)?par:(g<=1?null:g-1),kind);
  }
});

/* ---------- arranque ---------- */
function start(store){
  S.store=store;S.remote=true;
  var timer=null;
  function got(name,docs,meta){
    var o={};docs.forEach(function(d){o[d[0]]=d[1];});S.server[name]=o;
    if(!S.fresh)S.fresh=true;clearTimeout(timer);
    if(S.sync==="connecting"||S.sync==="stale"||S.sync==="err")setSync("live");
    render();}
  ["rounds","courses","config","extras","selfs","tees"].forEach(function(c){store.sub(c,function(d,m){got(c,d,m);});});
  store.status=function(ok){if(ok){clearTimeout(timer);if(S.sync==="connecting"||S.sync==="stale"||S.sync==="err")setSync("live");}else if(S.sync!=="saving")setSync("err");};
  store.onBad=function(){try{localStorage.removeItem("copa-code");}catch(e){}S.store=null;gate("La clave del torneo no es válida. Pedile el link a Angel.");};
  timer=setTimeout(function(){if(!S.fresh){setSync("stale");toast("El torneo no responde todavía. Mostrando lo último guardado.");}},10000);
}
function gate(msg){
  S.gate=true;TABS.forEach(function(t){$("v-"+t).hidden=true;});document.querySelector(".tabs").hidden=true;
  var g=$("gate");g.hidden=false;
  g.innerHTML='<div class="card"><h2>Entrá a la copa</h2><div class="fields"><label class="f">Clave del torneo<input type="text" id="gate-code" autocomplete="off" autocapitalize="off" placeholder="fieles-…"></label>'+(msg?'<div class="er">'+esc(msg)+'</div>':'')+'<div class="btns"><button class="btn" id="gate-go">Entrar</button></div><div class="note" style="margin:0">Lo más fácil es abrir el link que mandó Angel: la clave va incluida.</div></div></div>';
  $("gate-go").onclick=function(){var v=$("gate-code").value.trim(),m=v.match(/[?&]c=([^&\s]+)/);if(m)v=decodeURIComponent(m[1]);if(!v)return;
    try{localStorage.setItem("copa-code",v);}catch(e){}
    g.hidden=true;document.querySelector(".tabs").hidden=false;S.gate=false;boot(v);render();};
}
function boot(code){S.code=code;S.pending=loadPending();S.pendingS=loadPendingS();S.me=null;S.links=null;start(makeSB(code));
  if(!S.key){S.readOnly=true;setSync(S.sync);render();return;}
  (function auth(){rpc("copa_whoami",{p_code:code,p_token:S.key}).then(function(me){
      S.me=me;S.readOnly=false;setSync(S.sync);render();
      Object.keys(S.pending).forEach(function(k){var pid=k.split("_")[1];if(!(me.admin||canMark(pid)))delete S.pending[k];});
      Object.keys(S.pendingS).forEach(function(k){if(k.split("_")[1]!==me.player)delete S.pendingS[k];});
      savePending();
      [["rounds",S.pending],["selfs",S.pendingS]].forEach(function(z){Object.keys(z[1]).forEach(function(k){if(z[1][k]&&Object.keys(z[1][k]).length){var p=k.split("_");schedule(p[0],p[1],z[0]);}});});
      if(me.admin)rpc("copa_links",{p_code:code,p_token:S.key}).then(function(l){S.links=l;render();},function(){});
    },function(e){
      if(e&&e.code==="bad_key"){S.readOnly=true;setSync(S.sync);render();}
      else if(!(e&&e.code==="bad_code"))setTimeout(auth,4000);
    });})();}
(function init(){
  var code=null;
  try{var qs=new URLSearchParams(location.search),q=qs.get("c"),k=qs.get("k");
    if(q){code=q.trim();localStorage.setItem("copa-code",code);}else code=localStorage.getItem("copa-code");
    if(k){S.key=k.trim();localStorage.setItem("copa-key",S.key);}else S.key=localStorage.getItem("copa-key");}catch(e){}
  setSync("connecting");
  if(code){render();boot(code);}else gate("");
})();
})();
</script>
